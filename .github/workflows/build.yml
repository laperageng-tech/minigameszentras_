name: Build Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ekstrak project dari zip
        run: unzip -q ZentraMinigames-github-repo.zip -d project

      - name: Build dengan Maven
        run: mvn -B clean package
        working-directory: project

      - name: Upload jar (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ZentraMinigames
          path: project/target/ZentraMinigames-*.jar
          if-no-files-found: error

      - name: Buat Release (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: project/target/ZentraMinigames-*.jar
          generate_release_notes: true
